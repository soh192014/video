<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Watch</title>
<script src="data.js"></script>

<style>
body{
    margin:0;
    background:black;
    font-family:Arial;
    color:white;
}

.video{
    width:100%;
    height:100vh;
    object-fit:contain;
    background:black;
}

.overlay{
    position:absolute;
    bottom:0;
    width:100%;
    padding:20px;
    background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);
}

button{
    padding:10px 15px;
    border:none;
    border-radius:20px;
    background:#00c3ff;
    color:white;
    cursor:pointer;
}
</style>
</head>

<body>

<video id="video" class="video" controls></video>

<div class="overlay">
    <button onclick="back()">⬅ 返回主页</button>
</div>

<script>

const params = new URLSearchParams(location.search);
const id = params.get("id");

const video = document.getElementById("video");

// 找视频
const v = videos.find(x => x.id === id);

// Google Drive 播放
video.src = "https://drive.google.com/uc?export=download&id=" + id;

function back(){
    location.href = "index.html";
}

</script>

</body>
</html>
