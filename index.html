<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Video Site V1</title>

<style>
body{
    margin:0;
    height:100vh;
    overflow:hidden;
    font-family:Arial;

    /* 🌊 aqua + teal 动态背景 */
    background: linear-gradient(-45deg, aqua, teal, #00ffd5, #00bcd4);
    background-size:400% 400%;
    animation: bg 10s ease infinite;

    display:flex;
    justify-content:center;
    align-items:center;
}

@keyframes bg{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
}

/* 🎬 影院卡片 */
.card{
    width:92%;
    max-width:1000px;
    aspect-ratio:16/9;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    backdrop-filter:blur(25px);

    border-radius:22px;
    overflow:hidden;
    box-shadow:0 25px 80px rgba(0,0,0,0.4);

    position:relative;
}

/* 🎥 iframe */
iframe{
    width:100%;
    height:100%;
    border:none;
}

/* 🎯 标题 */
.title{
    position:absolute;
    top:12px;
    left:12px;

    color:white;
    font-size:16px;

    background:rgba(0,0,0,0.3);
    padding:6px 12px;
    border-radius:10px;
    backdrop-filter:blur(10px);
}

/* 💡 提示 */
.hint{
    position:absolute;
    bottom:12px;
    left:12px;

    color:white;
    font-size:12px;
    opacity:0.7;

    background:rgba(0,0,0,0.25);
    padding:6px 10px;
    border-radius:10px;
    backdrop-filter:blur(10px);
}
</style>
</head>

<body>

<div class="card">

    <div class="title">🎬 My First Video Site</div>

    <div class="hint">空格提示播放 / F 全屏 / 单视频模式 V1</div>

    <!-- 🎥 你的视频 -->
    <iframe
        src="https://drive.google.com/file/d/1oB_z3em4Nf0d6Wqq8qgxPyMOUNwBV6ph/preview"
        allow="autoplay"
        allowfullscreen>
    </iframe>

</div>

<script>

// ⌨️ 键盘功能（未来可扩展）
document.addEventListener("keydown", (e) => {

    // F 全屏
    if(e.key === "f" || e.key === "F"){
        if(!document.fullscreenElement){
            document.documentElement.requestFullscreen();
        }else{
            document.exitFullscreen();
        }
    }

    // 空格提示（iframe不能控制播放）
    if(e.code === "Space"){
        alert("🎬 请点击视频内播放按钮");
    }

});

</script>

</body>
</html>
