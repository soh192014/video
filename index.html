<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Video Platform</title>
<script src="data.js"></script>

<style>
body{
    margin:0;
    background:#0f0f0f;
    font-family:Arial;
    color:white;
}

header{
    padding:20px;
    font-size:24px;
    background:#181818;
    position:sticky;
    top:0;
}

.search{
    margin-top:10px;
}

input{
    width:100%;
    padding:10px;
    border-radius:10px;
    border:none;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:15px;
    padding:20px;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
}

.card h3{
    margin:10px;
    font-size:16px;
}
</style>
</head>

<body>

<header>
🎬 My Video Platform
<input class="search" id="search" placeholder="搜索视频...">
</header>

<div class="grid" id="grid"></div>

<script>

const grid = document.getElementById("grid");
const search = document.getElementById("search");

function render(list){
    grid.innerHTML = "";

    list.forEach(v => {
        grid.innerHTML += `
        <div class="card" onclick="openVideo('${v.id}')">
            <img src="${v.cover}">
            <h3>${v.title}</h3>
        </div>`;
    });
}

function openVideo(id){
    window.location.href = "watch.html?id=" + id;
}

// 搜索
search.oninput = () => {
    const q = search.value.toLowerCase();
    render(videos.filter(v => v.title.toLowerCase().includes(q)));
};

render(videos);

</script>

</body>
</html>
