<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dream Video Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#050505;
    overflow:hidden;
}

video{
    position:fixed;
    width:100%;
    height:100%;
    object-fit:cover;
}

.overlay{
    position:fixed;
    inset:0;
    background:linear-gradient(
        to top,
        rgba(0,0,0,.75),
        rgba(0,0,0,.15),
        rgba(0,0,0,.6)
    );
}

.controls{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:900px;

    background:rgba(255,255,255,.08);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;
    padding:20px;

    animation:up .8s;
}

@keyframes up{
    from{
        transform:translate(-50%,80px);
        opacity:0;
    }
    to{
        transform:translate(-50%,0);
        opacity:1;
    }
}

.progress{
    width:100%;
}

.buttons{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:15px;
}

button{
    border:none;
    cursor:pointer;
    padding:12px 20px;
    border-radius:50px;
    font-size:16px;
    background:#00d4ff;
    color:white;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#00a2ff;
}

input[type=range]{
    width:180px;
}

.title{
    position:absolute;
    top:40px;
    left:40px;
    color:white;
}

.title h1{
    font-size:50px;
    text-shadow:0 0 25px black;
}

.title p{
    opacity:.7;
}
</style>

</head>
<body>

<video id="video" autoplay loop>
    <!-- 修改这里 -->
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay">

<div class="title">
<h1>🎬 Dream Player</h1>
<p>Enjoy Your Movie</p>
</div>

<div class="controls">

<input class="progress" id="progress" type="range" min="0" max="100" value="0">

<div class="buttons">

<button id="play">▶ 播放</button>

<div style="color:white;">
🔊
<input id="volume" type="range" min="0" max="1" step="0.01" value="1">
</div>

</div>

</div>

</div>

<script>

const video=document.getElementById("video");
const play=document.getElementById("play");
const progress=document.getElementById("progress");
const volume=document.getElementById("volume");

play.onclick=()=>{

if(video.paused){
    video.play();
    play.innerHTML="⏸ 暂停";
}else{
    video.pause();
    play.innerHTML="▶ 播放";
}

}

video.addEventListener("timeupdate",()=>{

let p=(video.currentTime/video.duration)*100;
progress.value=p;

});

progress.oninput=()=>{

video.currentTime=
progress.value/100*video.duration;

}

volume.oninput=()=>{
video.volume=volume.value;
}

document.addEventListener("keydown",(e)=>{

if(e.code==="Space"){

e.preventDefault();

if(video.paused){
video.play();
play.innerHTML="⏸ 暂停";
}else{
video.pause();
play.innerHTML="▶ 播放";
}

}

});

</script>

</body>
</html>
