<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Video</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    /* 🌊 aqua + teal 背景 */
    background: linear-gradient(135deg, aqua, teal);
    font-family: Arial, sans-serif;
    overflow:hidden;
}

/* 🎬 主容器 */
.card{
    width:90%;
    max-width:900px;
    aspect-ratio:16/9;

    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    backdrop-filter: blur(20px);

    border-radius:20px;
    overflow:hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);

    position:relative;
}

/* 🎥 iframe 视频 */
iframe{
    width:100%;
    height:100%;
    border:none;
}

/* 🎯 标题 */
.title{
    position:absolute;
    top:15px;
    left:15px;
    color:white;
    font-size:18px;
    background:rgba(0,0,0,0.3);
    padding:6px 12px;
    border-radius:10px;
    backdrop-filter:blur(10px);
}
</style>
</head>

<body>

<div class="card">

    <div class="title">🎬 My Video Player</div>

    <!-- 🎥 Google Drive 视频 -->
    <iframe
        src="https://drive.google.com/file/d/1oB_z3em4Nf0d6Wqq8qgxPyMOUNwBV6ph/preview"
        allow="autoplay"
        allowfullscreen>
    </iframe>

</div>

</body>
</html>
